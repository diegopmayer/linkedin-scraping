[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobscan"
version = "0.1.0"
description = "On-demand scanner for remote US/Canada LinkedIn jobs that accept LATAM candidates"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pydantic>=2,<3",
    "pyyaml>=6",
    "duckdb>=1.1",
    "typer>=0.12",
    "anthropic>=0.70",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
]

[project.scripts]
jobscan = "jobscan.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"jobscan" = ["prompts/*.md", "adapters/sql/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not llm and not live'"
markers = [
    "llm: calls the real Anthropic API (needs ANTHROPIC_API_KEY)",
    "live: calls the real LinkedIn endpoints",
]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.10"
packages = ["jobscan"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
